<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <button type="button" class="btn-solid theme-primary" commandfor="invokerDrawer" command="show-modal">
        Open drawer
    </button>

    <dialog class="drawer drawer-end" tabindex="-1" id="invokerDrawer" aria-labelledby="invokerDrawerLabel">
        <div class="drawer-header">
            <h5 class="drawer-title" id="invokerDrawerLabel">កញ្ចប់អាហាររបស់អ្នក</h5>
            <button type="button" class="btn-close" commandfor="invokerDrawer" command="close"
                aria-label="Close"></button>
        </div>
        <div class="drawer-body">
            <div class="form-field">
                <label for="fieldSelect" class="form-label">ប្រភេទនៃការកម្មង់</label>
                <select class="form-control" id="fieldSelect">
                    <option selected>ញុាំនៅហាង(Dine-in)</option>
                    <option value="2">វិចខ្ចប់(Takeaway)</option>
                    <option value="3">ដឹកជញ្ជូន(Delivery)</option>
                </select>
            </div>
            <div>
                your choice
            </div>
            <div class="price">
                $$$$$$$ 
            </div>
            <div class="total">
                $$$$$$$
            </div>
            <button type="button" class="btn-solid theme-primary" data-bs-toggle="dialog"
                data-bs-target="#staticBackdropDialog" data-bs-backdrop="static">
                បន្តទៅលារទូទាត់ប្រាក់
            </button>

            <dialog class="dialog position-relative" id="staticBackdropDialog">
                <div class="dialog-header">
                    <div class="dialog-text">បំពេញព័ត៌មានទូទាត់</div>
                    <h1 class="dialog-title">បញ្ជាក់ការកម្មង់</h1>
                    <button type="button" class="btn-close position-absolute top-0 end-0 mt-3 me-3"
                        data-bs-dismiss="dialog" aria-label="Close"></button>
                </div>
                <div class="dialog-body">
                    <div class="name">
                        <label class="form-label">ឈ្មោះអ្នកទទួល</label>
                        <input type="password" class="form-control" placeholder="Heng Panha">
                    </div>
                    <div class="">
                        <label class="form-label">លេខអ្នកទទួល</label>
                        <input type="password" class="form-control" placeholder="+97 888 9999">
                    </div>
                    <div class="">
                        <label class="form-label">អាស័យដ្ឋាន/លេខតុ</label>
                        <input type="password" class="form-control" placeholder="ផ្ទះលេខ៣៥​ ផ្លូវលេខ១២A បុរីប៉េងហួត​​ / តុលេខ៤">
                    </div>
                    <div class="">
                        <label for="form-label">ចំនួនទឹកប្រាក់សរុប:</label>
                    </div>
                </div>
                <div class="dialog-footer">
                    <button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog">បង់ប្រាក់</button>
                </div>
            </dialog>
        </div>
    </dialog>






    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
