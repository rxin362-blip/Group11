<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login and Register</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <section class="py-3 login">
        <div class="container m-auto">
            <div class="card shadow-sm">
                <div class="card-header bg-transparent border-0 pt-3 px-3 pb-0" id="exampleModalLabel">
                    <ul class="nav nav-pills nav-justified w-100 border-0" id="pills-tab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link w-100 text-center active" id="pills-home-tab" data-bs-toggle="tab"
                                data-bs-target="#pills-home" type="button" role="tab" aria-controls="pills-home"
                                aria-selected="true">
                                <i class="bi bi-box-arrow-in-right me-1"></i>ចូលប្រើប្រាស់ (Login)
                            </button>
                        </li>
                        <li class="nav-item " role="presentation">
                            <button class="nav-link w-100 text-center" id="pills-profile-tab" data-bs-toggle="tab"
                                data-bs-target="#pills-profile" type="button" role="tab" aria-controls="pills-profile"
                                aria-selected="false">
                                <i class="bi bi-person-plus-fill me-1"></i>ចុះឈ្មោះ (Register)
                            </button>
                        </li>
                    </ul>
                </div>


                <div class="card-body p-3  ">
                    <!-- ================= LOGIN FORM ================= -->
                    <div class="tab-content" id="pills-tabContent">
                        <div class="tab-pane fade show active" id="pills-home" role="tabpanel"
                            aria-labelledby="pills-home-tab" tabindex="0">
                            <div class="text-center mb-4">
                                <h3 class="header mb-1">ចូលប្រើប្រាស់</h3>
                                <p class="title mb-0">សូមបញ្ចូលព័ត៌មានរបស់អ្នកដើម្បីចូលប្រើប្រាស់</p>
                            </div>
                            <form action="/login" method="POST">
                                <!-- Email -->
                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label small fw-bold text-light mb-1">អ៊ីមែល
                                        (Email
                                        Address)</label>
                                    <div class="input-group-custom">
                                        <i class="bi bi-envelope">
                                        </i>
                                        <input type="email" id="loginEmail" name="email"
                                            placeholder="vadaro@example.com" required>
                                    </div>
                                </div>
                                <!-- Password -->
                                <div class="mb-3">
                                    <label for="loginPassword"
                                        class="form-label small fw-bold text-light mb-1">ពាក្យសម្ងាត់
                                        (Password)</label>
                                    <div class="input-group-custom">
                                        <i class="bi bi-lock">
                                        </i>
                                        <input type="password" id="loginPassword" name="password" placeholder="••••••••"
                                            required>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <div class="form-check">
                                        <input class="form-check-input bg-dark border-secondary" type="checkbox"
                                            id="rememberMe">
                                        <label class="form-check-label small text-secondary"
                                            for="rememberMe">ចងចាំខ្ញុំ</label>
                                    </div>
                                    <a href="#" class="small text-decoration-none"
                                        style="color: #10b981;">ភ្លេចពាក្យសម្ងាត់?</a>
                                </div>
                                <button type="submit" class="btn btn-emerald w-100">ចូលប្រើប្រាស់
                                    (Login)</button>
                            </form>
                        </div>
                        <div class="tab-pane fade" id="pills-profile" role="tabpanel"
                            aria-labelledby="pills-profile-tab" tabindex="0">
                            <div class="text-center mb-4">
                                <h3 class="header mb-1">បង្កើតគណនីថ្មី</h3>
                                <p class="title mb-0">បំពេញព័ត៌មានខាងក្រោមដើម្បីចុះឈ្មោះ</p>
                            </div>
                            <form action="/register" method="POST">
                                <!-- Full Name -->
                                <div class="mb-3">
                                    <label for="regName" class="form-label small fw-bold text-light mb-1">
                                        ឈ្មោះពេញ (Full Name)</label>
                                    <div class="input-group-custom">
                                        <i class="bi bi-person"></i>
                                        <input type="text" id="regName" name="fullname" placeholder="វ៉ា​ ដារ៉ូ"
                                            required>
                                    </div>
                                </div>
                                <!-- Email -->
                                <div class="mb-3">
                                    <label for="regEmail" class="form-label small fw-bold text-light mb-1">អ៊ីមែល
                                        (Email
                                        Address)</label>
                                    <div class="input-group-custom">
                                        <i class="bi bi-envelope"></i>
                                        <input type="email" id="regEmail" name="email" placeholder="vadaro@example.com"
                                            required>
                                    </div>
                                </div>
                                <!-- Password -->
                                <div class="mb-3">
                                    <label for="regPassword"
                                        class="form-label small fw-bold text-light mb-1">ពាក្យសម្ងាត់
                                        (Password)</label>
                                    <div class="input-group-custom">
                                        <i class="bi bi-lock">
                                        </i>
                                        <input type="password" id="regPassword" name="password"
                                            placeholder="បញ្ចូលពាក្យសម្ងាត់" minlength="6" required>
                                    </div>
                                </div>
                                <!-- Confirm Password -->
                                <div class="mb-4">
                                    <label for="regConfirmPassword"
                                        class="form-label small fw-bold text-light mb-1">បញ្ជាក់ពាក្យសម្ងាត់
                                        (Confirm
                                        Password)</label>
                                    <div class="input-group-custom">
                                        <i class="bi bi-shield-lock">
                                        </i>
                                        <input type="password" id="regConfirmPassword" name="confirm_password"
                                            placeholder="បញ្ចូលពាក្យសម្ងាត់ម្ដងទៀត" minlength="6" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-emerald w-100 ">
                                    បង្កើតគណនី (Register Account)
                                </button>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>

    </section>






    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>

</body>

</html>
